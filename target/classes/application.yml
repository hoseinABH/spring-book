server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: flash-sale-engine

  # Java 21+ Virtual Threads: handles thousands of concurrent requests with lightweight fibers
  threads:
    virtual:
      enabled: true

  # PostgreSQL & HikariCP Connection Pool
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/flashsale_db}
    username: ${SPRING_DATASOURCE_USERNAME:flashsale_user}
    password: ${SPRING_DATASOURCE_PASSWORD:flashsale_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FlashSaleHikariCP
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  # Spring Data JPA / Hibernate
  jpa:
    open-in-view: false # Senior Best Practice: Disable OSIV to prevent silent DB queries in web layer
    hibernate:
      ddl-auto: validate # Flyway owns schema changes, Hibernate only validates
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

  # Database Migrations: Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Redis Configuration (Cache, Pub/Sub, Distributed Locks)
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 64
          max-idle: 16
          min-idle: 8
          max-wait: 2000ms

# Production Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Resilience4j Circuit Breaker for Payment Gateway
resilience4j:
  circuitbreaker:
    instances:
      paymentGateway:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50.0
        slow-call-rate-threshold: 50.0
        slow-call-duration-threshold: 2000ms
        wait-duration-in-open-state: 10000ms
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

logging:
  level:
    root: INFO
    com.flashsale: DEBUG
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
