services:
  postgres:
    image: postgres:16-alpine
    container_name: flashsale-postgres
    pull_policy: never
    restart: always
    environment:
      POSTGRES_DB: flashsale_db
      POSTGRES_USER: flashsale_user
      POSTGRES_PASSWORD: flashsale_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashsale_user -d flashsale_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flashsale-redis
    pull_policy: never
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
